# Logrotate Configuration for Dora Files
# Copy to: /etc/logrotate.d/dorafiles
#
# Installation:
# sudo cp config/logrotate.conf /etc/logrotate.d/dorafiles
# sudo chmod 644 /etc/logrotate.d/dorafiles
# sudo logrotate -d /etc/logrotate.d/dorafiles  # Test configuration

# Application Logs
/path/to/htdocs/files.regaletoimagl.fr/storage/logs/*.log {
    # Rotate daily
    daily

    # Keep 14 days of logs
    rotate 14

    # Don't rotate if log is empty
    notifempty

    # Compress old logs
    compress

    # Delay compression until next rotation
    delaycompress

    # Create new log file after rotation
    create 0640 www-data www-data

    # Continue if log file is missing
    missingok

    # Use date as suffix (e.g., security-20250123.log)
    dateext
    dateformat -%Y%m%d

    # Post-rotation script (optional)
    postrotate
        # Reload web server if needed
        # /usr/sbin/service apache2 reload > /dev/null 2>&1 || true
    endscript
}

# Cron Job Logs
/var/log/dorafiles-*.log {
    weekly
    rotate 4
    compress
    delaycompress
    notifempty
    create 0640 root root
    missingok
}

# Size-based rotation for security logs (if they grow large)
/path/to/htdocs/files.regaletoimagl.fr/storage/logs/security.log {
    # Rotate when file exceeds 10MB
    size 10M

    # Keep 30 rotated files
    rotate 30

    compress
    delaycompress
    notifempty
    create 0640 www-data www-data
    missingok
    dateext

    # Alert if file gets too large before rotation
    maxage 90
}
