# Dora Files - Nginx Configuration

# Allow large file uploads (up to 10GB)
client_max_body_size 12G;
client_body_timeout 3600s;
client_header_timeout 3600s;
send_timeout 3600s;
fastcgi_read_timeout 3600s;

# PHP-FPM configuration
location ~ \.php$ {
    fastcgi_pass 127.0.0.1:19009;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_read_timeout 3600s;
    fastcgi_send_timeout 3600s;
    fastcgi_connect_timeout 3600s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

# Download links routing: /dl/TOKEN -> /dl.php
location ~ ^/dl/([a-f0-9]+)$ {
    try_files $uri /dl.php?token=$1;
}

# Default routing
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Deny access to hidden files
location ~ /\. {
    deny all;
}

# Deny access to vendor directory
location ~ ^/vendor/ {
    deny all;
}

# Deny access to app directory
location ~ ^/app/ {
    deny all;
}
